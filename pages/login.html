
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineRate | Login</title>

    <!-- Shared CSS files -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="container header-content">

            <a href="../index.html" class="logo">
                Cine<span>Rate</span>
            </a>

            <p class="muted-text">
                Your destination for movie reviews
            </p>

        </div>
    </header>


    <!-- GUEST NAVIGATION -->
    <nav class="navbar navbar--guest">
        <div class="container">

            <ul class="nav-list">
                <li><a href="../index.html">Home</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>

        </div>
    </nav>


    <main class="container">

        <!-- LOGIN SECTION -->
        <section class="auth-section">

            <div class="auth-card">

                <div class="auth-heading">

                    <p class="muted-text">WELCOME BACK</p>

                    <h1>Login to CineRate</h1>

                    <p class="muted-text">
                        Enter your account details to continue.
                    </p>

                </div>


                <!-- LOGIN FORM -->
                <form action="#" method="post" class="auth-form">

                    <div class="form-group">

                        <label for="username">
                            Username or Email
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter your username or email"
                            required
                            autocomplete="username"
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >

                    </div>


                    <div class="remember-row">

                        <label class="remember-label">

                            <input
                                type="checkbox"
                                name="remember"
                                value="yes"
                            >

                            Remember me

                        </label>

                    </div>


                    <button type="submit" class="btn btn-primary auth-button">
                        Login
                    </button>

                </form>


                <!-- SIGNUP LINK -->
                <div class="auth-footer">

                    <p>
                        Don't have an account?

                        <a href="signup.html">
                            Create an account
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container footer-content">

            <p>
                &copy; 2026 CineRate. All rights reserved.
            </p>

            <p>
                Discover movies. Share your opinions.
            </p>

        </div>
    </footer>

</body>
</html>
